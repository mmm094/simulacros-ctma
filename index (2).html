<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="Simulacros tipo test de Ciencia y Tecnología del Medio Ambiente (primer parcial). Desarrollado por Miguel Martos.">
<title>Simulacros CTMA · Miguel Martos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF0EC; --surface:#FFFFFF; --ink:#16302B; --muted:#56706A; --line:#C9D6CF;
  --brand:#0E6B62; --brand-ink:#FFFFFF; --ochre:#B7791F;
  --ok:#1E9E57; --ok-bg:#DDF5E7; --bad:#D63F3A; --bad-bg:#FBE1DF; --blank:#9AAAA4;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1B19; --surface:#152724; --ink:#E4EEEA; --muted:#9BB2AB; --line:#2A403C;
    --brand:#3FB7A9; --brand-ink:#08201D; --ochre:#E2A64B;
    --ok:#3BD07F; --ok-bg:#123A27; --bad:#FF6A63; --bad-bg:#43201E; --blank:#5E726C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
    --bg:#0E1B19; --surface:#152724; --ink:#E4EEEA; --muted:#9BB2AB; --line:#2A403C;
    --brand:#3FB7A9; --brand-ink:#08201D; --ochre:#E2A64B;
    --ok:#3BD07F; --ok-bg:#123A27; --bad:#FF6A63; --bad-bg:#43201E; --blank:#5E726C;
    color-scheme: dark;}
*{box-sizing:border-box}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:18px;z-index:20}
.modal .box{background:var(--surface);color:var(--ink);border-radius:16px;padding:20px;max-width:420px;width:100%;border:1px solid var(--line)}
.modal .row{justify-content:flex-end;margin-top:14px}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  display:flex;flex-direction:column;min-height:100%}
main{flex:1;width:100%;max-width:760px;margin:0 auto;padding:20px 18px 40px}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0 0 .4em}
h1{font-size:clamp(2rem,6vw,3.1rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.6rem;font-weight:700}
h3{font-size:1.15rem;font-weight:700;margin-top:1.4em}
p{margin:0 0 1em;max-width:65ch}
.muted{color:var(--muted)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:760px;margin:0 auto;padding:14px 18px 0;width:100%}
.brandmark{font-family:var(--display);font-weight:800;font-size:1.05rem;color:var(--brand);text-decoration:none;background:none;border:0;padding:0;cursor:pointer}
.devline{max-width:760px;width:100%;margin:6px auto 0;padding:0 18px;font-family:var(--display);font-size:1.15rem;font-weight:500;color:var(--muted)}
.devline strong{color:var(--ink);font-weight:700}
.linkbtn{background:none;border:0;color:var(--muted);font:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:4px}
footer{border-top:1px solid var(--line);padding:16px 18px;text-align:center;color:var(--muted);font-size:.92rem}
footer strong{color:var(--ink)}
button{font:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:2px solid var(--brand);
  background:var(--brand);color:var(--brand-ink);font-weight:700;padding:13px 20px;cursor:pointer;min-height:48px}
.btn.ghost{background:transparent;color:var(--brand)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.opt:focus-visible,.choice:focus-visible,.linkbtn:focus-visible,.brandmark:focus-visible{outline:3px solid var(--ochre);outline-offset:2px}
.hero{padding:22px 0 10px}
.hero p{font-size:1.08rem}
.modes{display:grid;gap:14px;margin:22px 0}
.mode{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.mode h2{font-size:1.3rem;margin-bottom:.2em}
.mode p{margin-bottom:.8em}
.choices{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.choice{border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:700}
.choice[aria-pressed="true"]{border-color:var(--brand);background:var(--brand);color:var(--brand-ink)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stat-line{display:flex;flex-wrap:wrap;gap:18px;margin:6px 0 0;color:var(--muted);font-size:.95rem}
/* tira de progreso: una celda por pregunta */
.strip{display:flex;flex-wrap:wrap;gap:3px;margin:8px 0 18px}
.cell{width:16px;height:16px;border-radius:4px;background:var(--line);border:0;padding:0;cursor:pointer}
.cell:disabled{cursor:default;opacity:.55}
.cell.now{outline:2px solid var(--ochre);outline-offset:1px}
.cell:not(.ok):not(.bad):not(.blank).now{background:var(--ochre)}
.cell.ok{background:var(--ok)} .cell.bad{background:var(--bad)} .cell.blank{background:var(--blank)}
.qhead{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:.95rem;margin-bottom:6px}
.qtext{font-family:var(--display);font-weight:700;font-size:clamp(1.25rem,3.6vw,1.6rem);line-height:1.25;margin:0 0 18px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);color:var(--ink);
  border:2px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;min-height:56px;transition:background .15s,border-color .15s}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.9rem;color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--brand)}
.opt:disabled{cursor:default}
.opt.correct{background:var(--ok-bg);border-color:var(--ok)} .opt.correct .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)} .opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.src{display:inline-block;font-size:.85rem;font-weight:700;color:var(--ochre);margin:0 10px 8px 0}
.tag{display:inline-block;font-weight:700;font-size:.9rem;border-radius:999px;padding:3px 12px;margin:0 0 10px}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.bad{background:var(--bad-bg);color:var(--bad)} .tag.blank{background:var(--line);color:var(--ink)}
.expl{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:14px 0 0}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:.9rem}
.grade{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 28px;margin:10px 0 6px}
.grade .big{font-family:var(--display);font-weight:800;font-size:clamp(3.4rem,13vw,5.5rem);line-height:.9}
.grade .pct{font-family:var(--display);font-weight:700;font-size:1.8rem;color:var(--muted)}
.counts{display:flex;flex-wrap:wrap;gap:8px 20px;margin:10px 0 4px}
.counts span b{font-size:1.15rem}
.c-ok{color:var(--ok)} .c-bad{color:var(--bad)}
.temas{margin:8px 0;padding:0;list-style:none}
.temas li{padding:10px 0;border-bottom:1px solid var(--line)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok)}
.bar i.low{background:var(--bad)} .bar i.mid{background:var(--ochre)}
.review{margin:10px 0;padding:0;list-style:none}
.review li{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--bad);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.review li.blank{border-left-color:var(--blank)}
.review .ans{color:var(--ok);font-weight:700}
.review .exp{color:var(--muted);font-size:.95rem;margin:.3em 0 0}
.rules{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 20px 14px}
.rules ul{padding-left:1.1em} .rules li{margin:.45em 0}
.formula{font-family:var(--display);font-weight:700;font-size:1.15rem;background:var(--bg);border-radius:10px;padding:12px 14px;display:inline-block;margin:4px 0 12px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:22px;margin:20px 0}
.hidden{display:none !important}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</head>

<script>
// Formato: [tema, pregunta, [opciones], índiceCorrecto, explicación, fijo(1 = no mezclar opciones)]
// Para añadir preguntas nuevas, añádelas SIEMPRE al final (el identificador es la posición).
const TEMAS = {
  T1: "Tema 1: Ecología y ecosistema",
  T2a: "Tema 2: Biosfera y metabolismo",
  T2b: "Tema 2: Energía y producción primaria",
  T3: "Tema 3: Redes tróficas y descomposición",
  T4: "Tema 4: Ciclos y cambio climático",
  T5: "Tema 5: Comunidad, sucesión y diversidad",
  P1: "Práctica 1: Gestión ambiental y legislación",
  P2: "Práctica 2: Contenido del EsIA",
  P3: "Práctica 3: Caracterización de impactos",
  P4: "Práctica 4: Causas de impacto ambiental"
};
const BANK = [
// ---------- TEMA 1 ----------
["T1","El concepto de Ecología como ciencia de los ecosistemas se debe a:",["González Bernáldez","Margalef","Lovelock","Ninguno de los anteriores"],0,"Ciencia → González Bernáldez. Biología → Margalef."],
["T1","El concepto de Ecología como biología de los ecosistemas se debe a:",["Margalef","González Bernáldez","Lovelock","Ninguno de los anteriores"],0,"Biología de los ecosistemas → Margalef (primer catedrático de Ecología en España)."],
["T1","El concepto de Ecología como química de los ecosistemas se debe a:",["González Bernáldez","Lovelock","Margalef","Ninguno de los anteriores"],3,"No aparece en las diapositivas: ciencia es de González Bernáldez y biología de Margalef."],
["T1","El primer autor en definir el concepto de ecosistema fue:",["Tansley","Vernadsky","Clements","Lovelock"],0,"Tansley lo definió como un nivel de organización con interdependencia entre organismos."],
["T1","El primer autor en usar el término «biosfera» fue:",["Vernadsky","Tansley","Margalef","Odum"],0,"Vernadsky acuñó el término biosfera; Tansley definió el ecosistema."],
["T1","Cualquier ecosistema autosuficiente debe incluir a la vez:",["Productores y descomponedores","Productores y consumidores","Consumidores y descomponedores","Solo productores"],0,"Unos fabrican la materia orgánica y otros devuelven los nutrientes al medio."],
["T1","Si definimos la ecología como el estudio de la distribución y abundancia de los organismos, hablamos de una ecología:",["Evolutiva","Termodinámica","Del paisaje","Climática"],0,"Es la definición clásica centrada en el organismo: ecología evolutiva."],
["T1","Indica la afirmación INCORRECTA sobre la consideración termodinámica de los ecosistemas:",["Son sistemas físicos en equilibrio","Son sistemas abiertos","Son sistemas alejados del equilibrio","Procesan y transfieren energía"],0,"Los ecosistemas son abiertos y alejados del equilibrio."],
["T1","La ecología termodinámica sustituye al individuo y a la especie por:",["Compartimentos o niveles tróficos","Poblaciones","Genes","Paisajes"],0,"Usa variables agregadas: compartimentos o niveles tróficos."],
["T1","La idea de que «el todo es más que la suma de las partes» corresponde a la ecología:",["Termodinámica","Evolutiva","Reduccionista","De poblaciones"],0,"Visión holística con propiedades emergentes."],
["T1","Un ejemplo de ecosistema heterótrofo (fotosíntesis/respiración < 1) sería:",["Una ciudad","Una pradera","Un bosque joven","Un cultivo de maíz"],0,"La ciudad consume más de lo que produce y depende de fuera."],
["T1","En un ecosistema autótrofo la relación fotosíntesis/respiración es:",["Mayor que 1","Igual a 1","Menor que 1","Igual a 0"],0,"Autótrofo: P/R > 1. Heterótrofo: P/R < 1."],
["T1","En el ser humano actual, la energía exosomática respecto a la endosomática es:",["Mayor","Menor","Igual","Ninguna de las anteriores, no existe energía exosomática"],0,"Usamos mucha más energía fuera del cuerpo (combustibles, electricidad) que la del metabolismo."],
["T1","Un ecosistema agrícola se diferencia de uno natural en que:",["Hay menos especies","Los nutrientes se recirculan mucho","La producción se queda dentro del sistema","No necesita energía auxiliar"],0,"El agrosistema es abierto: la producción sale, recicla poco y tiene menos especies."],
["T1","Biocenosis + biotopo forman:",["Un ecosistema","Una comunidad","Una población","La biosfera"],0,"La biocenosis es la comunidad y el biotopo el medio físico."],
["T1","González Bernáldez se asocia principalmente a la ecología:",["Terrestre","Marina","Microbiana","Evolutiva"],0,"Margalef → ecología acuática; González Bernáldez → terrestre."],
["T1","El paisaje se define como:",["La percepción plurisensorial de un sistema de relaciones ecológicas","El biotopo de una comunidad","Un ecosistema sin seres humanos","El conjunto de parcelas de cultivo"],0,"Es la proyección geográfica del ecosistema."],
// ---------- TEMA 2a ----------
["T2a","¿En qué capa de la atmósfera se suele encontrar el CO2?",["Troposfera","Estratosfera","Tropopausa","Ionosfera"],0,"Es la pregunta más repetida de la asignatura."],
["T2a","¿En qué capa de la atmósfera se encuentra el O3?",["Estratosfera","Troposfera","Mesosfera","Ninguna de las anteriores, no hay O3 en la atmósfera"],0,"El ozono está en la estratosfera y hace que la temperatura suba con la altura."],
["T2a","El principal gas de la atmósfera es:",["Nitrógeno","Oxígeno","Dióxido de carbono","Argón"],0,"N2 ≈ 78 %, O2 ≈ 21 %, argón ≈ 0,9 %."],
["T2a","H2S + CO2 → S + CH2O. Indica el proceso:",["Fotosíntesis anaeróbica","Quimiosíntesis aeróbica","Sulfatorreducción","Respiración anaeróbica"],0,"Bacterias del azufre: usan luz y H2S como donante; no liberan O2."],
["T2a","En la reacción H2S + CO2 → S + CH2O, el compuesto que pasa de oxidado a reducido es:",["CO2 a CH2O","H2S a S","CH2O a S","S a CO2"],0,"El CO2 gana electrones y se reduce a CH2O."],
["T2a","En la reacción H2S + CO2 → S + CH2O, el donante de electrones en su forma OXIDADA es:",["S","H2S","CO2","CH2O"],0,"El donante entra reducido (H2S) y sale oxidado (S)."],
["T2a","S + NO3- → SO4 2- + N2. Es:",["Quimiosíntesis anaeróbica","Fotosíntesis anaeróbica","Quimiosíntesis aeróbica","Respiración aeróbica"],0,"Sin luz ni O2. La realiza Thiobacillus denitrificans."],
["T2a","S + NO3- → SO4 2- + N2. ¿Qué proceso está implícito en la ecuación?",["Desnitrificación","Sulfatorreducción","Sulfato-oxidación","Oxigenación del nitrógeno"],0,"El nitrato pasa a N2: desnitrificación."],
["T2a","En la ecuación S + NO3- → SO4 2- + N2, el receptor de electrones (oxidado) es:",["NO3-","SO4 2-","S","N2"],0,"El nitrato recibe los electrones y sale como N2."],
["T2a","El proceso CH2O + SO4 2- → CO2 + H2S:",["Es sulfatorreducción en ambientes anaeróbicos","Es sulfatorreducción en ambientes aeróbicos","Es fotosíntesis anaeróbica del sulfato","Es fotosíntesis aeróbica del sulfato"],0,"El sulfato actúa como receptor en lugar del O2 (Desulfovibrio, Desulfobacter)."],
["T2a","CO2 + 4H2 → CH4 + 2H2O. El proceso indicado es:",["Metanogénesis","Descarboxilación","Oxigenación del hidrógeno","Hidrogenación"],0,"Metanogénesis por reducción de CO2."],
["T2a","La formación de CH4 a partir de CO2 en anaerobiosis puede considerarse un proceso:",["Quimioautótrofo","Heterótrofo","Fotoautótrofo","Ninguna de las anteriores, no se forma CH4 a partir de CO2"],0,"El carbono viene del CO2 (auto-) y la energía es química (quimio-)."],
["T2a","La fermentación es un proceso ligado a la materia orgánica que se da:",["En ausencia de oxígeno y se puede obtener lactato","En presencia de oxígeno y se obtiene CO2","En presencia de oxígeno y se obtiene CH4","En ausencia de oxígeno y se obtienen sulfatos"],0,"Lactobacillus → lactato; Saccharomyces → etanol. El CH4 sale de la metanogénesis."],
["T2a","Un organismo quimiolitoautótrofo utiliza:",["Energía de reacciones químicas, carbono inorgánico y electrones de compuestos inorgánicos","Luz, carbono inorgánico y electrones inorgánicos","Energía química, carbono orgánico y electrones orgánicos","Luz y carbono orgánico"],0,"Ejemplo: las bacterias nitrificantes."],
["T2a","Las plantas son organismos:",["Fotolitoautótrofos","Quimiorganoheterótrofos","Quimiolitoautótrofos","Fotoorganoheterótrofos"],0,"Luz, electrones del agua (inorgánico) y carbono del CO2."],
["T2a","La nitrificación es un proceso:",["Quimiosintético aeróbico","Quimiosintético anaeróbico","Fotosintético aeróbico","De respiración anaeróbica"],0,"Necesita oxígeno: Nitrosomonas y Nitrobacter."],
["T2a","La desnitrificación se da principalmente en sistemas:",["Eutróficos","Oligotróficos","Con alta concentración de oxígeno","Desérticos"],0,"Necesita falta de oxígeno."],
["T2a","En la nitrificación, la bacteria Nitrobacter transforma:",["NO2- en NO3-","NH4+ en NO2-","NO3- en N2","N2 en NH4+"],0,"Nitrosomonas: NH4+ → NO2-. Nitrobacter: NO2- → NO3-."],
["T2a","El pH máximo compatible con la vida microbiana es aproximadamente:",["12 (Plectonema)","14 (Thiobacillus)","10 (halófilos)","7 (cualquier bacteria)"],0,"pH de 0 (Thiobacillus) a 12 (Plectonema)."],
["T2a","La temperatura máxima compatible con la vida microbiana es aproximadamente:",["120 °C (hipertermófilos)","80 °C","100 °C","150 °C"],0,"De −12 °C (psicrófilos) a 120 °C (hipertermófilos)."],
["T2a","El potencial redox mínimo para la vida (−450 mV) lo soportan:",["Los metanógenos","Las bacterias del hierro","Los halófilos","Los psicrófilos"],0,"Las bacterias del Fe soportan el máximo (+850 mV)."],
["T2a","¿En qué ecosistema acuático no se suele formar termoclina?",["Un humedal","Un lago profundo","Un océano","Un embalse"],0,"Es poco profundo y el agua se mezcla entera."],
["T2a","La formación de la termoclina se debe al proceso de:",["Difusión turbulenta","Evaporación","Sedimentación","Fotosíntesis"],0,"La turbulencia mezcla la capa superficial y deja debajo un salto brusco de temperatura."],
["T2a","Cuando la materia orgánica se oxida en un ecosistema:",["Libera energía","Absorbe energía","No varía la energía","Ninguna de las anteriores"],0,"Oxidar libera energía; reducir la absorbe."],
["T2a","En sedimentos con sulfato, la metanogénesis:",["Queda inhibida por las bacterias sulfatorreductoras hasta que se agota el sulfato","Es siempre el proceso dominante","Necesita oxígeno","Produce sulfato"],0,"Lo comentó el profe: el metano solo se forma cuando se acaba el sulfato."],
// ---------- TEMA 2b ----------
["T2b","La producción primaria neta representa:",["La tasa real de nueva biomasa que queda a disposición de los heterótrofos","La tasa real de nueva biomasa que queda a disposición de los autótrofos","La transformación de energía química en luminosa","La biomasa total acumulada"],0,"Es lo que queda tras la respiración de la planta."],
["T2b","La producción bruta la relacionas con:",["Asimilación","Crecimiento","Reproducción","Ingestión"],0,"PB = lo asimilado = PN + R."],
["T2b","¿La producción neta puede tener un valor negativo?",["Sí, bajo limitación de recursos, y la biomasa disminuye","Nunca, siempre es positiva","No, porque siempre hay recursos","Sí, por aumento de recursos"],0,"PN = PB − R: si la respiración supera lo asimilado, la biomasa baja."],
["T2b","La eficiencia bruta de crecimiento está relacionada con:",["La ingestión","La asimilación","La fotosíntesis","La reproducción"],0,"EBC = PN / ingestión."],
["T2b","¿Qué cociente define mejor la eficiencia de asimilación?",["Asimilación / ingestión","Producción / ingestión","Ingestión / producción","Asimilación / producción"],0,"EA = A / I."],
["T2b","La eficiencia de producción es:",["Pn/An × 100","An/In × 100","In/Pn × 100","Pn/In × 100"],0,"Porcentaje de lo asimilado que pasa a nueva biomasa (ENC)."],

<script>

const FIXED_END = /^(ninguna|ninguno|todas|todos)\b/i;

function ask(msg, yes, onYes){

  m.innerHTML=`<div class="box"><p style="margin:0">${msg}</p><div class="row"><button class="btn ghost" data-a="no">Cancelar</button><button class="btn" data-a="yes">${yes}</button></div></div>`;
  document.body.appendChild(m); m.querySelector('[data-a="yes"]').focus();
  m.onclick=e=>{const a=e.target.dataset.a; if(a||e.target===m){m.remove(); if(a==="yes") onYes();}};
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

// ===================== estado =====================

    const tail = order.filter(k => FIXED_END.test(opts[k]));

    order = body.concat(tail);
  }
  return { id, t, q, e, opts: order.map(k => opts[k]), correct: order.indexOf(c) };
}

const has = (id, keys) => keys.some(k => BANK[id][1].toLowerCase().includes(k.toLowerCase()));

// Elige n preguntas de un grupo, priorizando las menos vistas para variar
function pick(ids, n){
  return shuffle(ids.slice())
    .sort((a, b) => (seen[a] || 0) - (seen[b] || 0) + (Math.random() - 0.5) * 1.2)
    .slice(0, Math.max(0, n));
}

// Cada simulacro es distinto: ~55 % preguntas de exámenes reales, ~30 % remarcadas en clase y ~15 % del resto (pocas gráficas)
function buildPart(ids, n){
  const exam = ids.filter(isExam), cls = ids.filter(isClass);
  const rest = ids.filter(i => !isExam(i) && !isClass(i));
  const nE = Math.round(n * 0.55), nC = Math.round(n * 0.30);
  let out = pick(exam, nE).concat(pick(cls, nC));
  const restNoGraf = rest.filter(i => !isGraf(i)), graf = rest.filter(isGraf);
  const nG = Math.min(graf.length, Math.random() < 0.5 ? 1 : 2);
  out = out.concat(pick(graf, Math.min(nG, n - out.length)));
  out = out.concat(pick(restNoGraf, n - out.length));
  if(out.length < n) out = out.concat(pick(ids.filter(i => !out.includes(i)), n - out.length));
  return shuffle(out);
}
function buildSimulacro(n){
  const all = BANK.map((_, i) => i);
  if(n >= all.length) return shuffle(all);
  const teo = all.filter(i => isTeo(BANK[i][0])), pra = all.filter(i => !isTeo(BANK[i][0]));
  const nTeo = Math.round(n * 25 / 40);
  return buildPart(teo, nTeo).concat(buildPart(pra, n - nTeo));
}

function start(mode, ids){
  run = { mode, items: ids.map(makeItem), i: 0, results: [], locked: false };
  showQuestion();
}

function firstOpen(){ const k = run.items.findIndex((_, i) => !run.results[i]); return k < 0 ? run.items.length : k; }

function stripHTML(){
  const fo = firstOpen();
  return `<div class="strip" role="group" aria-label="Ir a una pregunta">${run.items.map((_, k) => {
    const r = run.results[k];
    const cls = (r ? r.status : "") + (k === run.i ? " now" : "");
    const can = r || k === fo;
    return `<button class="cell ${cls}" data-go="${k}" ${can ? "" : "disabled"} aria-label="Pregunta ${k + 1}"></button>`;
  }).join("")}</div>`;
}

function go(k){
  if(!run) return;
  clearTimeout(run.timer);
  if(k < 0) return;
  if(k >= run.items.length){ finish(); return; }
  run.i = k; showQuestion();
}

function showQuestion(){
  const it = run.items[run.i];
  const r = run.results[run.i];
  const answered = r && r.status !== "blank";
  run.locked = !!answered;
  const last = run.i === run.items.length - 1;
  const fo = firstOpen();
  const nextLabel = (last && fo >= run.items.length) ? "Ver nota" : "Siguiente →";
  app.innerHTML = `
  <div class="qhead"><span>${run.mode === "rev" ? "Repaso de falladas" : run.mode === "graf" ? "Gráficas" : "Simulacro"} · Pregunta ${run.i + 1} de ${run.items.length}</span><span>${esc(TEMAS[it.t])}</span></div>
  ${stripHTML()}
  ${r ? `<p class="tag ${r.status}">${r.status === "ok" ? "La acertaste" : r.status === "bad" ? "La fallaste" : "La dejaste en blanco: aún puedes contestarla"}</p>` : ""}
  <p class="qtext" id="qtext">${esc(it.q)}</p>
  <div class="opts" role="group" aria-labelledby="qtext">
    ${it.opts.map((o, k) => `<button class="opt${answered && k === it.correct ? " correct" : ""}${answered && k === r.chosen && r.status === "bad" ? " wrong" : ""}" data-k="${k}" ${answered ? "disabled" : ""}><span class="k">${"ABCD"[k]}</span><span>${esc(o)}</span></button>`).join("")}
  </div>
  ${answered ? `<p class="expl"><b>Por qué:</b> ${esc(it.e)}</p>` : ""}
  <div class="qfoot">
    <div class="row">
      <button class="btn ghost" id="prevBtn" ${run.i === 0 ? "disabled" : ""}>← Anterior</button>
      ${r ? `<button class="btn ghost" id="nextBtn">${nextLabel}</button>` : `<button class="btn ghost" id="blankBtn">Dejar en blanco</button>`}
    </div>
    <button class="linkbtn" id="quit">Terminar y ver nota</button>
  </div>`;
  if(!answered) app.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(+b.dataset.k));
  app.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(+b.dataset.go));
  $("#prevBtn").onclick = () => go(run.i - 1);
  if($("#nextBtn")) $("#nextBtn").onclick = next;
  if($("#blankBtn")) $("#blankBtn").onclick = () => answer(null);
  $("#quit").onclick = () => { ask("¿Terminar ahora? Las preguntas que queden se cuentan en blanco.","Terminar y ver nota",()=>{ if(run) finish(); }); };
  window.scrollTo(0,0);
}

function next(){
  if(!run) return;
  if(run.i + 1 < run.items.length) go(run.i + 1);
  else { const fo = firstOpen(); fo >= run.items.length ? finish() : go(fo); }
}

function answer(k){
  if(!run || run.locked) return;
  const it = run.items[run.i];
  const prev = run.results[run.i];
  if(k === null && prev) { next(); return; }       // ya estaba en blanco: solo avanzar
  run.locked = true;
  const btns = app.querySelectorAll(".opt");
  btns.forEach(b => b.disabled = true);
  if($("#blankBtn")) $("#blankBtn").disabled = true;
  let status = "blank";
  if(k !== null){
    status = k === it.correct ? "ok" : "bad";
    btns[it.correct].classList.add("correct");
    if(status === "bad") btns[k].classList.add("wrong");
  }
  run.results[run.i] = { status, chosen: k };
  if(!prev) seen[it.id] = (seen[it.id] || 0) + 1;
  if(status === "ok"){
    if(run.mode === "rev") delete fails[it.id];
    else if(prev && fails[it.id]){ fails[it.id]--; if(!fails[it.id]) delete fails[it.id]; } // antes contaba como en blanco
  } else if(!prev){
    fails[it.id] = (fails[it.id] || 0) + 1;
  }
  store.set("ctma_seen", seen); store.set("ctma_fails", fails);
  const cells = app.querySelectorAll(".cell");
  if(cells[run.i]) cells[run.i].className = "cell " + status + " now";
  const at = run.i;
  run.timer = setTimeout(() => { if(run && run.i === at) next(); }, status === "blank" ? 300 : 1000);
}

function finish(){
  const items = run.items, res = run.items.map((_, k) => run.results[k] || { status: "blank", chosen: null });
  const n = items.length;
  const ok = res.filter(r => r.status === "ok").length;
  const bad = res.filter(r => r.status === "bad").length;
  const blank = n - ok - bad;
  const nota = Math.max(0, (ok - bad / 2) / n * 10);
  // por tema
  const by = {};
  items.forEach((it, k) => {
    const g = by[it.t] || (by[it.t] = { ok: 0, bad: 0, blank: 0, n: 0 });
    g.n++; g[res[k].status]++;
  });
  const temas = Object.keys(by).map(t => {
    const g = by[t]; const net = Math.max(0, (g.ok - g.bad / 2) / g.n);
    return { t, ...g, net };
  }).sort((a, b) => a.net - b.net);
  const weak = temas.filter(x => x.net < 0.7);
  const missed = items.map((it, k) => ({ it, r: res[k] })).filter(x => x.r.status !== "ok");
  const verdict = nota >= 9 ? "Sobresaliente" : nota >= 7 ? "Notable" : nota >= 5 ? "Aprobado" : "Suspenso";
  const mode = run.mode;
  run = null;
  app.innerHTML = `
  <h2 style="margin-top:14px">${mode === "rev" ? "Resultado del repaso" : mode === "graf" ? "Resultado de gráficas" : "Resultado del simulacro"}</h2>
  <div class="grade">
    <span class="big">${fmt(nota)}</span>
    <span class="pct">${fmt(nota * 10, 1)} %</span>
    <span class="pct" style="font-size:1.3rem">${verdict}</span>
  </div>
  <div class="counts">
    <span class="c-ok"><b>${ok}</b> aciertos</span>
    <span class="c-bad"><b>${bad}</b> fallos</span>
    <span class="muted"><b>${blank}</b> en blanco</span>
    <span class="muted">de ${n} preguntas</span>
  </div>
  <p class="muted">Nota = (${ok} − ${bad} ÷ 2) ÷ ${n} × 10. Cada 2 fallos restan 1 acierto.</p>

  <h3>Qué debes practicar más</h3>
  ${weak.length
    ? `<p>Tu punto débil ${weak.length > 1 ? "son estos temas" : "es este tema"}, ordenado${weak.length > 1 ? "s" : ""} de peor a mejor: <b>${weak.map(w => esc(TEMAS[w.t])).join("</b>; <b>")}</b>. Repasa sus apuntes y luego usa “Repasar falladas”.</p>`
    : `<p>Has superado el 70 % neto en todos los temas. Sigue haciendo simulacros para mantenerlo.</p>`}
  <ul class="temas">
    ${temas.map(x => {
      const p = Math.round(x.net * 100);
      return `<li><b>${esc(TEMAS[x.t])}</b><br><span class="muted">${x.ok} bien · ${x.bad} mal · ${x.blank} en blanco · ${p} % neto</span>
      <div class="bar"><i class="${p < 50 ? "low" : p < 70 ? "mid" : ""}" style="width:${p}%"></i></div></li>`;
    }).join("")}
  </ul>

  <div class="row" style="margin:20px 0">
    <button class="btn" id="again">Nuevo simulacro</button>
    <button class="btn ghost" id="rev" ${Object.keys(fails).length ? "" : "disabled"}>Repasar falladas</button>
    <button class="linkbtn" id="home2">Volver al inicio</button>
  </div>

  ${missed.length ? `<h3>Preguntas que has fallado o dejado en blanco</h3>
  <ul class="review">
    ${missed.map(({ it, r }) => `<li class="${r.status}">
      <span class="muted">${esc(TEMAS[it.t])} · ${r.status === "bad" ? "Fallada" : "En blanco"}</span>
      <p style="margin:.25em 0"><b>${esc(it.q)}</b></p>
      ${r.status === "bad" ? `<p style="margin:0;color:var(--bad)">Tu respuesta: ${esc(it.opts[r.chosen])}</p>` : ""}
      <p class="ans" style="margin:0">Correcta: ${esc(it.opts[it.correct])}</p>
      <p class="exp">${esc(it.e)}</p></li>`).join("")}
  </ul>` : `<p>No has fallado ninguna. ¡Perfecto!</p>`}`;
  $("#again").onclick = () => start("sim", buildSimulacro(size));
  $("#home2").onclick = home;
  const rv = $("#rev"); if(!rv.disabled) rv.onclick = () => start("rev", shuffle(Object.keys(fails).map(Number).filter(id => BANK[id])));
  window.scrollTo(0,0);
}

// ===================== teclado y navegación =====================
document.addEventListener("keydown", e => {
  if(!run || document.querySelector(".modal")) return;
  if(e.key === "ArrowLeft"){ e.preventDefault(); go(run.i - 1); return; }
  if(e.key === "ArrowRight" && run.results[run.i]){ e.preventDefault(); next(); return; }
  if(run.locked) return;
  const map = { a:0, b:1, c:2, d:3, "1":0, "2":1, "3":2, "4":3 };
  const k = map[e.key.toLowerCase()];
  if(k !== undefined){ e.preventDefault(); answer(k); }
  else if(e.key === " "){ e.preventDefault(); answer(null); }
});
$("#goHome").onclick = () => { if(!run) home(); else ask("¿Salir del simulacro? Perderás el progreso de este intento.","Salir",home); };
$("#goRules").onclick = () => { if(!run) rules(); else ask("¿Salir del simulacro para ver las instrucciones? Perderás el progreso.","Salir",rules); };
home();
</script>
</body>
</html>
